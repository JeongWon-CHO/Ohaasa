name: Backup database

# 무료 티어는 자동 백업을 제공하지 않는다. 데이터가 세상에 한 벌뿐이라
# 신고 처리용 delete SQL을 손으로 실행하다 where 절을 빠뜨리면 그대로 끝이다.
#
# 특히 horoscopes는 되돌릴 방법이 아예 없다 — 아사히 API는 당일치만 주므로
# 누적된 과거 데이터가 날아가면 통계 화면의 추이를 다시 모으는 수밖에 없다.
#
# pg_dump 대신 PostgREST로 뜬다: DB 비밀번호가 필요 없고 크롤러가 이미 쓰는
# service_role 키 하나로 끝난다. 대신 스키마 DDL은 담기지 않는다(데이터만).

on:
  schedule:
    # UTC 기준. KST 07:30 — 크롤링(KST 05:59)이 재시도까지 끝난 뒤에 뜬다.
    # 그날 크롤링 결과가 포함된 상태로 백업하기 위함.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: ohaasa-backup-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump all tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role은 RLS와 GRANT를 우회한다 — anon에게 SELECT가 닫힌
          # notification_log·*_reports까지 담으려면 이 키여야 한다.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTDIR: backup
        run: python3 .github/scripts/backup-tables.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohaasa-db-backup-${{ github.run_id }}
          path: backup.tar.gz
          retention-days: 30
          if-no-files-found: error
