name: Backup database

# 무료 티어는 자동 백업을 제공하지 않는다. 데이터가 세상에 한 벌뿐이라
# 신고 처리용 delete SQL을 손으로 실행하다 where 절을 빠뜨리면 그대로 끝이다.
#
# 특히 horoscopes는 되돌릴 방법이 아예 없다 — 아사히 API는 당일치만 주므로
# 누적된 과거 데이터가 날아가면 통계 화면의 추이를 다시 모으는 수밖에 없다.

on:
  schedule:
    # UTC 기준. KST 07:30 — 크롤링(KST 05:59)이 재시도까지 끝난 뒤에 뜬다.
    # 그날 크롤링 결과가 포함된 상태로 백업하기 위함.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: ohaasa-backup-db
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 접속 정보 중 비밀이 아닌 것은 여기 둔다. secret은 비밀번호 하나뿐이다.
  #
  # 비밀번호를 URL에 박지 않는 이유: @ : / ? # 가 하나라도 들어가면 libpq의 URI
  # 파싱이 깨지면서 엉뚱한 사용자로 접속을 시도하고, 서버는 그저
  # "password authentication failed"라고만 답한다. 원인을 찾기 아주 어렵다.
  # PGPASSWORD로 넘기면 어떤 문자가 들어 있든 그대로 전달된다.
  PGHOST: aws-1-ap-northeast-2.pooler.supabase.com
  PGPORT: "5432" # Session pooler. Transaction pooler(6543)로는 pg_dump가 실패한다.
  PGUSER: postgres.khszicvinkgtqsyqiecc # pooler는 사용자명 뒤 project ref로 테넌트를 찾는다
  PGDATABASE: postgres

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Dump public schema
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${PGPASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret이 비어 있습니다."
            exit 1
          fi

          # ── secret 형태 진단 ────────────────────────────────────────
          # 값 자체는 절대 찍지 않는다. 인증 실패는 원인이 값 안에 있는데 값을 볼 수 없어
          # 진단이 막히므로, 흔한 실수 세 가지만 형태로 판별한다.
          echo "비밀번호 길이: ${#PGPASSWORD}자"

          case "$PGPASSWORD" in
            postgres://*|postgresql://*)
              echo "::error::접속 URL 전체가 들어 있습니다. 비밀번호 문자열만 넣어주세요."
              exit 1 ;;
            *"[YOUR-PASSWORD]"*|*"["*"]"*)
              echo "::error::대괄호 자리표시자가 그대로 남아 있습니다."
              exit 1 ;;
          esac

          TRIMMED=$(printf '%s' "$PGPASSWORD" | tr -d '[:space:]')
          if [ "${#TRIMMED}" -ne "${#PGPASSWORD}" ]; then
            echo "::error::공백 또는 개행이 섞여 있습니다 (복사할 때 딸려온 경우가 많습니다). 길이 ${#PGPASSWORD} → 공백 제거 시 ${#TRIMMED}"
            exit 1
          fi

          # 서버가 Postgres 17이라 pg_dump도 17이어야 한다. 러너 기본 클라이언트는
          # 구버전이라 "server version mismatch"로 거부당하므로 컨테이너로 버전을 맞춘다.
          # -e VAR (값 없음)은 호스트의 값을 그대로 넘긴다 — 커맨드라인에 남지 않는다.
          # --entrypoint로 pg_dump를 직접 부른다. 이미지 기본 entrypoint는
          # 인자를 보고 서버를 띄우려 들 수 있어서 우회하는 편이 확실하다.
          docker run --rm --entrypoint pg_dump \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD \
            postgres:17-alpine \
            --schema=public --no-owner --no-privileges \
            > backup.sql

          echo "덤프 크기: $(wc -c < backup.sql) bytes"

      - name: Verify dump
        # 백업에서 가장 나쁜 실패는 "조용히 빈 파일이 쌓이는 것"이다.
        # 복원이 필요한 날에야 알게 되므로, 여기서 반드시 터뜨린다.
        run: |
          set -euo pipefail

          SIZE=$(wc -c < backup.sql)
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::덤프가 비정상적으로 작습니다 (${SIZE} bytes). 접속 또는 권한을 확인하세요."
            exit 1
          fi

          # 핵심 테이블이 실제로 담겼는지 확인한다. 테이블이 존재하는데 행이 0이면
          # COPY 구문은 남으므로, 스키마 누락과 데이터 누락을 모두 잡는다.
          MISSING=""
          for T in horoscopes user_devices question_answers question_answer_replies; do
            if ! grep -q "COPY public\.${T} " backup.sql; then
              MISSING="$MISSING $T"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "::error::덤프에 다음 테이블이 없습니다:$MISSING"
            exit 1
          fi

          # 참고용 행 수 (COPY 블록은 \. 로 끝난다)
          for T in horoscopes user_devices question_answers; do
            N=$(awk "/^COPY public\.${T} /{f=1;next} f&&/^\\\\\.$/{f=0} f{c++} END{print c+0}" backup.sql)
            echo "  ${T}: ${N} rows"
          done

          gzip -9 backup.sql
          echo "압축 후: $(wc -c < backup.sql.gz) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohaasa-db-backup-${{ github.run_id }}
          path: backup.sql.gz
          retention-days: 30
          if-no-files-found: error
