name: Prepare community AI examples
on:
  schedule:
    - cron: '0 21 * * *' # KST/JST 06:00; GitHub schedule can be delayed.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate with AI without writing to the database'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: community-review-examples
  cancel-in-progress: false
jobs:
  seed:
    # Enabled by default; set the repository variable to false to stop publication.
    if: github.event_name == 'workflow_dispatch' || vars.COMMUNITY_REVIEW_CONTENT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared TypeScript runner
        working-directory: backend
        run: npm ci
      - name: Generate safe AI examples for the daily question
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_ANSWER_DEVICE_ID: ${{ secrets.REVIEW_ANSWER_DEVICE_ID }}
          REVIEW_REPLY_DEVICE_ID: ${{ secrets.REVIEW_REPLY_DEVICE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: npx tsx ../.github/scripts/seed-community-review.mjs
